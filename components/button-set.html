
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>

    <style>
        

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6fa;
    padding: 30px;
}

h2 {
    color: #333;
    font-size: 20px;
}


.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: bold;
    text-decoration: none;
}


.button-group .btn {
    margin-right: 10px;
    margin-bottom: 10px;
}


.btn-secondary,
.btn-outline {
    color: #333;
}


.btn-primary {
    background-color: #315b91;
    color: white;
    border: 1px solid #315b91;
}


.btn-secondary {
    background-color: rgb(231, 237, 245);
    border: 1px solid #b8c9df;
}


.btn-outline {
    background-color: white;
    border: 2px solid #315b91;
}


.btn-send {
    background-color: rgba(233, 148, 66, 1);
    color: white;
    border: 1px solid #e99442;
}


.btn-primary:hover {
    background-color: #222;
    color: white;
}

.btn-secondary:hover {
    background-color: #b8c9df;
}

.btn-outline:hover {
    background-color: #ddd;
}

.btn-send:hover {
    background-color: red;
}

    </style>
</head>

<body>

    <main>
        <h2>Tombol</h2>

        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>

            <a href="#" class="btn btn-secondary">Unduh CV</a>

            <a href="#" class="btn btn-outline">Hubungi Saya</a>

            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>
       
        <footer>
            <a href="#">Kembali ke Beranda</a>
        </footer>
    </main>

</body>
</html>
