<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #333;
            margin: 30px auto;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
        }

        .card h3 {
            color: #222;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: blue;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="../assets/images/dana.jpg" alt="Gambar Proyek">
            <h3>Website Toko Online</h3>
            <p>
                Proyek ini membuat tampilan halaman toko online
                sederhana menggunakan HTML dan CSS.
            </p>
            <a href="#">Lihat Proyek</a>
        </div>
    </main>
</body>
</html>
