
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak</title>

    <style>
        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Body */
        body {
            margin: 0;
            background-color: #f4f7fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ID Contact */
        #contact {
            padding: 40px 20px;
        }

        /* Class Contact Form */
        .contact-form {
            width: 400px;
            max-width: 100%;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #ccc;
            background-color: white;
            border-radius: 5px;
        }

        /* Descendant Selector */
        .contact-form h2 {
            text-align: center;
            color: #203c60;
        }

        /* Class Form Group */
        .form-group {
            margin-bottom: 16px;
        }

        /* Descendant Selector */
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        /* Grouping Selector */
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Focus Pseudo-class */
        .form-group input:focus,
        .form-group textarea:focus {
            background-color: #eaf2ff;
            border-color: #203c60;
            outline: none;
        }

        /* Button Submit */
        .btn-submit {
            background-color: #203c60;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Hover Pseudo-class */
        .btn-submit:hover {
            background-color: orange;
        }
    </style>
</head>

<body>

    <section id="contact">

        <form class="contact-form">

            <h2>Hubungi Saya</h2>

            <div class="form-group">
                <label for="nama">Nama</label>
                <input type="text" id="nama" name="nama">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="pesan">Pesan</label>
                <textarea id="pesan" name="pesan" rows="4"></textarea>
            </div>

            <button type="submit" class="btn-submit">
                Kirim Pesan
            </button>

        </form>

    </section>

    <footer style="text-align: center;">
        <a href="../index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
